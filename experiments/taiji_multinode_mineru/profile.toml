[profiles.ray-h20-2node]
# Reference only.  The launcher reads this private file only for an explicit
# submit/status/cleanup operation; plan/static checks never open it.
cmk_file = "/ABSOLUTE/PATH/TO/YOUR/CMK"
compute_spec_file = "compute_h20_2node.json"
remote_workdir = "hydp_runs/clapliang/rayorch_v36_mineru_h20_2node"
wait = true
poll_interval = 10
max_wait = 172800
compute_ready_timeout = 7200
poll_error_grace = 300
concurrency = 1

# Intentional: orchestrate.py detaches only after the full job is RUNNING and
# leaves both that job and its owned compute alive.  Use the explicit cleanup
# command (with the compute id as confirmation) after inspecting completion.
keep_compute = true
keep_remote_files = true

