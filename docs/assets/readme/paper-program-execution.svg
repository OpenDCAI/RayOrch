<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">From Python pipeline to lineage-aware Ray execution</title>
  <desc id="desc">A RayOrch pipeline declares ordinary calls and structural operations. The runtime compiles those declarations into persistent lineage and executes ready calls through actor pools.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#102a43" flood-opacity="0.12"/></filter></defs>
  <rect width="1200" height="560" rx="18" fill="#f7f9fc"/>
  <text x="48" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#102a43">Write a pipeline like a program; execute it like a dataflow</text>
  <text x="48" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#52606d">The user declares structure once. RayOrch keeps that structure stable while Ray supplies actors, resources, and placement.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="42" y="112" width="1116" height="118" rx="14" fill="#fff" stroke="#bcccdc" stroke-width="2" filter="url(#shadow)"/>
    <text x="64" y="145" font-size="20" font-weight="700" fill="#243b53">1. Python program</text>
    <rect x="64" y="165" width="208" height="42" rx="8" fill="#e8f1fb" stroke="#5b8def"/><text x="168" y="192" text-anchor="middle" font-size="16" fill="#204a87">pages = render(pdf)</text><path d="M272 186 H303" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="303" y="165" width="198" height="42" rx="8" fill="#e8f1fb" stroke="#5b8def"/><text x="402" y="192" text-anchor="middle" font-size="16" fill="#204a87">pages = F.expand(pages)</text><path d="M501 186 H532" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="532" y="165" width="176" height="42" rx="8" fill="#fff4e6" stroke="#f29d38"/><text x="620" y="192" text-anchor="middle" font-size="16" fill="#9c5a08">ocr = model(pages)</text><path d="M708 186 H739" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="739" y="165" width="198" height="42" rx="8" fill="#fff4e6" stroke="#f29d38"/><text x="838" y="192" text-anchor="middle" font-size="16" fill="#9c5a08">doc = F.reduce(ocr)</text><path d="M937 186 H968" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="968" y="165" width="166" height="42" rx="8" fill="#e8f1fb" stroke="#5b8def"/><text x="1051" y="192" text-anchor="middle" font-size="16" fill="#204a87">return doc</text>
    <rect x="42" y="258" width="540" height="242" rx="14" fill="#fff" stroke="#7b61a8" stroke-width="2" filter="url(#shadow)"/>
    <text x="64" y="293" font-size="20" font-weight="700" fill="#4c3b70">2. Structural control plane</text><text x="64" y="320" font-size="15" fill="#627d98">Persistent meaning: membership, order, readiness, and parent scope.</text>
    <rect x="72" y="350" width="106" height="48" rx="8" fill="#e8f1fb" stroke="#5b8def"/><text x="125" y="380" text-anchor="middle" font-size="16" fill="#204a87">PDF A</text><rect x="72" y="420" width="106" height="48" rx="8" fill="#fff4e6" stroke="#f29d38"/><text x="125" y="450" text-anchor="middle" font-size="16" fill="#9c5a08">PDF B</text>
    <path d="M178 374 H222" stroke="#52606d" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M178 444 H222" stroke="#52606d" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="222" y="343" width="124" height="64" rx="8" fill="#edf7ed" stroke="#4f8a4f"/><text x="284" y="371" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6b2f">children</text><text x="284" y="393" text-anchor="middle" font-size="14" fill="#486581">A₀, A₁</text><rect x="222" y="413" width="124" height="64" rx="8" fill="#fff8e1" stroke="#d4a72c"/><text x="284" y="441" text-anchor="middle" font-size="16" font-weight="700" fill="#8a6714">children</text><text x="284" y="463" text-anchor="middle" font-size="14" fill="#8d6b3d">B₀, B₁, B₂</text>
    <path d="M346 375 H387" stroke="#52606d" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M346 445 H387" stroke="#52606d" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="387" y="365" width="158" height="94" rx="8" fill="#f0f4f8" stroke="#829ab1" stroke-dasharray="6 4"/><text x="466" y="395" text-anchor="middle" font-size="16" font-weight="700" fill="#334e68">ordered reduce</text><text x="466" y="420" text-anchor="middle" font-size="14" fill="#627d98">each parent closes</text><text x="466" y="440" text-anchor="middle" font-size="14" fill="#627d98">as soon as it can</text>
    <rect x="618" y="258" width="540" height="242" rx="14" fill="#fff" stroke="#4f7cac" stroke-width="2" filter="url(#shadow)"/>
    <text x="640" y="293" font-size="20" font-weight="700" fill="#23527c">3. Physical execution plane</text><text x="640" y="320" font-size="15" fill="#627d98">Transient work: ready items are packed for Ray actor pools.</text>
    <rect x="640" y="350" width="156" height="100" rx="8" fill="#f0f4f8" stroke="#829ab1" stroke-dasharray="6 4"/><text x="718" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#334e68">ready queue</text><text x="718" y="408" text-anchor="middle" font-size="15" fill="#204a87">A₀ · B₀ · A₁</text><text x="718" y="432" text-anchor="middle" font-size="14" fill="#627d98">FIFO per Call</text><path d="M796 400 H838" stroke="#52606d" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="838" y="350" width="136" height="100" rx="8" fill="#e8f1fb" stroke="#5b8def"/><text x="906" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#204a87">Ray actors</text><text x="906" y="408" text-anchor="middle" font-size="15" fill="#486581">CPU / GPU</text><text x="906" y="432" text-anchor="middle" font-size="14" fill="#627d98">retries local</text><path d="M974 400 H1016" stroke="#52606d" stroke-width="2.2" marker-end="url(#arrow)"/>
    <rect x="1016" y="350" width="120" height="100" rx="8" fill="#fff4e6" stroke="#f29d38"/><text x="1076" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#9c5a08">outputs</text><text x="1076" y="408" text-anchor="middle" font-size="15" fill="#8d6b3d">values</text><text x="1076" y="432" text-anchor="middle" font-size="14" fill="#8d6b3d">or typed issues</text>
  </g>
  <text x="600" y="548" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#163a5f">The logical result does not depend on batch composition, placement, or retry timing.</text>
</svg>
