<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Lineage-controlled execution for variable-cardinality data</title>
  <desc id="desc">Two documents expand into different numbers of children. Ready children can share one physical execution microbatch, then ordered reduction rebuilds each document independently.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#102a43" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="520" rx="18" fill="#f7f9fc"/>
  <text x="48" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#102a43">One logical lineage, many physical batches</text>
  <text x="48" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#52606d">The scheduler may mix ready children for throughput; ownership, order, and completion remain explicit.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="42" y="112" width="238" height="282" rx="14" fill="#fff" stroke="#bcccdc" stroke-width="2" filter="url(#shadow)"/>
    <text x="64" y="148" font-size="20" font-weight="700" fill="#243b53">1. Inputs</text><text x="64" y="176" font-size="15" fill="#627d98">Each parent has its own shape.</text>
    <rect x="64" y="205" width="194" height="62" rx="10" fill="#e8f1fb" stroke="#5b8def" stroke-width="2"/><text x="80" y="232" font-size="19" font-weight="700" fill="#204a87">PDF A</text><text x="80" y="253" font-size="15" fill="#486581">2 pages</text>
    <rect x="64" y="286" width="194" height="82" rx="10" fill="#fff4e6" stroke="#f29d38" stroke-width="2"/><text x="80" y="314" font-size="19" font-weight="700" fill="#9c5a08">PDF B</text><text x="80" y="337" font-size="15" fill="#8d6b3d">3 pages</text><text x="80" y="357" font-size="14" fill="#8d6b3d">input-dependent fan-out</text>
    <path d="M280 253 H326" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="326" y="112" width="250" height="282" rx="14" fill="#fff" stroke="#bcccdc" stroke-width="2" filter="url(#shadow)"/>
    <text x="348" y="148" font-size="20" font-weight="700" fill="#243b53">2. Expand</text><text x="348" y="176" font-size="15" fill="#627d98">F.expand records parent and position.</text>
    <text x="350" y="218" font-size="16" font-weight="700" fill="#204a87">A →</text><rect x="406" y="194" width="58" height="42" rx="8" fill="#e8f1fb" stroke="#5b8def"/><text x="435" y="220" text-anchor="middle" font-size="16" fill="#204a87">A₀</text><rect x="476" y="194" width="58" height="42" rx="8" fill="#e8f1fb" stroke="#5b8def"/><text x="505" y="220" text-anchor="middle" font-size="16" fill="#204a87">A₁</text>
    <text x="350" y="294" font-size="16" font-weight="700" fill="#9c5a08">B →</text><rect x="406" y="270" width="58" height="42" rx="8" fill="#fff4e6" stroke="#f29d38"/><text x="435" y="296" text-anchor="middle" font-size="16" fill="#9c5a08">B₀</text><rect x="476" y="270" width="58" height="42" rx="8" fill="#fff4e6" stroke="#f29d38"/><text x="505" y="296" text-anchor="middle" font-size="16" fill="#9c5a08">B₁</text><rect x="406" y="326" width="58" height="42" rx="8" fill="#fff4e6" stroke="#f29d38"/><text x="435" y="352" text-anchor="middle" font-size="16" fill="#9c5a08">B₂</text>
    <path d="M576 253 H622" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="622" y="112" width="250" height="282" rx="14" fill="#fff" stroke="#bcccdc" stroke-width="2" filter="url(#shadow)"/>
    <text x="644" y="148" font-size="20" font-weight="700" fill="#243b53">3. Execute</text><text x="644" y="176" font-size="15" fill="#627d98">A temporary microbatch may mix parents.</text>
    <rect x="646" y="205" width="202" height="136" rx="10" fill="#f0f4f8" stroke="#829ab1" stroke-dasharray="7 5" stroke-width="2"/><text x="747" y="231" text-anchor="middle" font-size="16" font-weight="700" fill="#334e68">Execution microbatch</text>
    <rect x="666" y="252" width="50" height="38" rx="7" fill="#e8f1fb" stroke="#5b8def"/><text x="691" y="277" text-anchor="middle" font-size="16" fill="#204a87">A₀</text><rect x="724" y="252" width="50" height="38" rx="7" fill="#fff4e6" stroke="#f29d38"/><text x="749" y="277" text-anchor="middle" font-size="16" fill="#9c5a08">B₀</text><rect x="782" y="252" width="50" height="38" rx="7" fill="#e8f1fb" stroke="#5b8def"/><text x="807" y="277" text-anchor="middle" font-size="16" fill="#204a87">A₁</text><rect x="695" y="299" width="50" height="38" rx="7" fill="#fff4e6" stroke="#f29d38"/><text x="720" y="324" text-anchor="middle" font-size="16" fill="#9c5a08">B₁</text><rect x="753" y="299" width="50" height="38" rx="7" fill="#fff4e6" stroke="#f29d38"/><text x="778" y="324" text-anchor="middle" font-size="16" fill="#9c5a08">B₂</text>
    <text x="747" y="374" text-anchor="middle" font-size="14" fill="#627d98">batch membership is not lineage</text><path d="M872 253 H918" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="918" y="112" width="240" height="282" rx="14" fill="#fff" stroke="#bcccdc" stroke-width="2" filter="url(#shadow)"/>
    <text x="940" y="148" font-size="20" font-weight="700" fill="#243b53">4. Reduce</text><text x="940" y="176" font-size="15" fill="#627d98">F.reduce restores declared order.</text>
    <rect x="940" y="205" width="194" height="68" rx="10" fill="#e8f1fb" stroke="#5b8def" stroke-width="2"/><text x="958" y="231" font-size="18" font-weight="700" fill="#204a87">Document A</text><text x="958" y="254" font-size="15" fill="#486581">[A₀, A₁]</text>
    <rect x="940" y="292" width="194" height="76" rx="10" fill="#fff4e6" stroke="#f29d38" stroke-width="2"/><text x="958" y="319" font-size="18" font-weight="700" fill="#9c5a08">Document B</text><text x="958" y="342" font-size="15" fill="#8d6b3d">[B₀, B₁, B₂]</text><text x="958" y="360" font-size="14" fill="#8d6b3d">parents finish independently</text>
  </g>
  <rect x="42" y="429" width="1116" height="56" rx="12" fill="#d9eaf7" stroke="#7aa7c7"/><text x="600" y="464" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#163a5f">Lineage is the source of truth; physical batching is a temporary optimization.</text>
</svg>
