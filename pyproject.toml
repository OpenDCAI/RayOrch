[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rayorch"
description = "Cardinality-aware, completion-driven dataflow orchestration on Ray"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11, <4"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
]
keywords = [
    "AI",
    "artificial intelligence",
]
dynamic = ["version", "dependencies"]

[project.urls]
Github = "https://github.com/OpenDCAI/RayOrch"
"Bug Reports" = "https://github.com/OpenDCAI/RayOrch/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rayorch*"]

[tool.setuptools.package-data]
"rayorch.benchmarks.mineru" = ["env.json", "README.md"]
"rayorch.benchmarks.panda70m" = ["env.json", "README.md"]
"rayorch.benchmarks.document_topology" = ["env.json", "README.md"]
"rayorch.benchmarks.dual_vllm" = ["env.json", "README.md"]
"rayorch.benchmarks.sglang_vllm" = ["env.json", "README.md"]
"rayorch.benchmarks.video_caption" = ["env.json", "README.md"]
"rayorch.benchmarks.video_multimodal" = ["env.json", "README.md"]
"rayorch.benchmarks.yolo_sam" = ["env.json", "README.md"]


[tool.setuptools.dynamic]
version = {attr = "rayorch.version.__version__"}
dependencies = {file = "requirements.txt"}
